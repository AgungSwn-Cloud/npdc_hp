<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Akuntansi Nusa Penida Dive Center</title>
  <meta name="theme-color" content="#0b4f8a">
  <meta name="description" content="Aplikasi akuntansi Nusa Penida Dive Center">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Akuntansi DC">

  <style>
    :root { --biru: #0b4f8a; --gelap: #06346e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--gelap); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    iframe { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; bottom: env(safe-area-inset-bottom);
             width: 100%; height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)); border: 0; background: #fff; }

    #loading, #offline {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; color: #fff; text-align: center; padding: 24px;
      background: linear-gradient(180deg, #0ea5be, var(--gelap));
      transition: opacity .4s;
    }
    #loading img, #offline img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    .spin { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    #offline { display: none; z-index: 20; }
    .btn { display: inline-block; padding: 10px 18px; border-radius: 10px; background: #fff; color: var(--biru);
           text-decoration: none; font-weight: 600; border: 0; font-size: 15px; cursor: pointer; }
    #fallback { display: none; font-size: 14px; opacity: .95; }
    #fallback a { color: #ffd45a; }
  </style>
</head>
<body>

  <div id="loading">
    <img src="icon-192.png" alt="Logo">
    <div style="font-weight:700;font-size:18px">Nusa Penida Dive Center</div>
    <div class="spin"></div>
    <div id="fallback">Lama memuat? <a id="tab" href="#" target="_blank" rel="noopener">Buka di tab baru</a></div>
  </div>

  <div id="offline">
    <img src="icon-192.png" alt="Logo">
    <div style="font-weight:700;font-size:18px">Tidak ada koneksi internet</div>
    <div>Aplikasi membutuhkan internet untuk membuka data.</div>
    <button class="btn" onclick="location.reload()">Coba lagi</button>
  </div>

  <iframe id="app" title="Akuntansi Nusa Penida Dive Center"
          allow="clipboard-read; clipboard-write; fullscreen; camera; microphone; geolocation"></iframe>

  <script>
    // === GANTI DI SINI jika URL deployment Apps Script berubah ===
    var APP_URL = "https://script.google.com/macros/s/AKfycbxAx53J3J8X4qf50BR1uAnAjLote7avq9rK6uzaZgS8LnAL5V0maQm7ml3Mpf8F3VGlSA/exec";

    var frame = document.getElementById('app');
    var loading = document.getElementById('loading');
    var offline = document.getElementById('offline');
    document.getElementById('tab').href = APP_URL;

    function mulai() {
      if (!navigator.onLine) { offline.style.display = 'flex'; return; }
      offline.style.display = 'none';
      frame.src = APP_URL;
      setTimeout(function () { document.getElementById('fallback').style.display = 'block'; }, 8000);
    }

    frame.addEventListener('load', function () {
      loading.style.opacity = 0;
      setTimeout(function () { loading.style.display = 'none'; }, 400);
    });

    window.addEventListener('online', function () { location.reload(); });
    window.addEventListener('offline', function () { offline.style.display = 'flex'; });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW gagal:', e); });
      });
    }
    mulai();
  </script>
</body>
</html>
